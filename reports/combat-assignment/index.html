<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>本周分工 / Weekly Assignments</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e8eef5;
      --muted: #93a4b8;
      --accent: #5eb1ff;
      --border: #2b3644;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 20px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #17202a, var(--bg));
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .header-text { min-width: 0; flex: 1 1 240px; }
    h1 { margin: 0 0 6px; font-size: 1.35rem; font-weight: 650; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .lang-switch {
      display: inline-flex;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      flex: 0 0 auto;
    }
    .lang-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #243447;
      color: #fff;
      box-shadow: 0 0 0 1px rgba(94, 177, 255, 0.35);
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(15, 20, 25, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
    }
    .tab:hover { border-color: var(--accent); }
    .tab.active {
      background: #243447;
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 0 1px rgba(94, 177, 255, 0.35);
    }
    main { padding: 16px 20px 40px; }
    .viewer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      overflow: auto;
    }
    .viewer img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      border-radius: 6px;
    }
    .caption {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .summary {
      margin: 12px 20px 0;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      white-space: pre-wrap;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
      max-height: 180px;
      overflow: auto;
    }
    a.raw {
      color: var(--accent);
      text-decoration: none;
    }
    body.lang-en { font-family: Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body>
  <header>
    <div class="header-text">
      <h1><span class="i18n" data-zh="本周分工" data-en="Weekly Assignments">本周分工</span></h1>
      <div class="meta">
        <span class="i18n" data-zh="战斗方案：" data-en="Combat plan: ">战斗方案：</span>2026-09-04 09:23:54 北京时间
        <span class="i18n" data-zh=" · 点选下方条目浏览生活/战斗图片" data-en=" · Pick a tab to browse life/combat images"> · 点选下方条目浏览生活/战斗图片</span>
      </div>
    </div>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" class="lang-btn active" data-lang="zh">中文</button>
      <button type="button" class="lang-btn" data-lang="en">English</button>
    </div>
  </header>
  
  <nav class="tabs" aria-label="Weekly assignment images">
      <button type="button" class="tab active" data-index="0" data-src-zh="../life-assignment/latest.png" data-src-en="../life-assignment/latest.png" data-label-zh="生活分工" data-label-en="Life Trials"><span class="i18n" data-zh="生活分工" data-en="Life Trials">生活分工</span></button>
      <button type="button" class="tab" data-index="1" data-src-zh="1-chameleon-summary.png" data-src-en="1-chameleon-summary.en.png" data-label-zh="变色龙 · 阵容与技能" data-label-en="Chameleon · Roster &amp; Skills"><span class="i18n" data-zh="变色龙 · 阵容与技能" data-en="Chameleon · Roster &amp; Skills">变色龙 · 阵容与技能</span></button>
      <button type="button" class="tab" data-index="2" data-src-zh="1-chameleon-members.png" data-src-en="1-chameleon-members.en.png" data-label-zh="变色龙 · 成员明细" data-label-en="Chameleon · Members"><span class="i18n" data-zh="变色龙 · 成员明细" data-en="Chameleon · Members">变色龙 · 成员明细</span></button>
      <button type="button" class="tab" data-index="3" data-src-zh="2-swarm-summary.png" data-src-en="2-swarm-summary.en.png" data-label-zh="虫群 · 阵容与技能" data-label-en="Swarm · Roster &amp; Skills"><span class="i18n" data-zh="虫群 · 阵容与技能" data-en="Swarm · Roster &amp; Skills">虫群 · 阵容与技能</span></button>
      <button type="button" class="tab" data-index="4" data-src-zh="2-swarm-members.png" data-src-en="2-swarm-members.en.png" data-label-zh="虫群 · 成员明细" data-label-en="Swarm · Members"><span class="i18n" data-zh="虫群 · 成员明细" data-en="Swarm · Members">虫群 · 成员明细</span></button>
  </nav>
  <main>
    <p class="caption" id="caption"></p>
    <div class="viewer">
      <img id="preview" src="../life-assignment/latest.png" alt="" />
    </div>
  </main>
  <script>
    const LANG_KEY = "mwi-weekly-assignment-lang";
    const tabs = Array.from(document.querySelectorAll(".tab"));
    const langButtons = Array.from(document.querySelectorAll(".lang-btn"));
    const preview = document.getElementById("preview");
    const caption = document.getElementById("caption");
    let lang = localStorage.getItem(LANG_KEY) === "en" ? "en" : "zh";
    let activeIndex = 0;

    function applyI18n() {
      document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
      document.body.classList.toggle("lang-en", lang === "en");
      document.querySelectorAll(".i18n").forEach((node) => {
        const value = node.getAttribute(lang === "en" ? "data-en" : "data-zh");
        if (value != null) node.textContent = value;
      });
      langButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
      });
    }

    function openLinkLabel() {
      return lang === "en" ? "Open original" : "打开原图";
    }

    function select(index) {
      activeIndex = index;
      const tab = tabs[index];
      if (!tab) return;
      tabs.forEach((node, i) => node.classList.toggle("active", i === index));
      const src = tab.getAttribute(lang === "en" ? "data-src-en" : "data-src-zh") || "";
      const label = tab.getAttribute(lang === "en" ? "data-label-en" : "data-label-zh") || "";
      preview.src = src;
      preview.alt = label;
      caption.innerHTML = label + ' · <a class="raw" href="' + src + '" target="_blank" rel="noopener">' + openLinkLabel() + "</a>";
    }

    function setLang(next) {
      lang = next === "en" ? "en" : "zh";
      localStorage.setItem(LANG_KEY, lang);
      applyI18n();
      select(activeIndex);
    }

    tabs.forEach((tab, index) => tab.addEventListener("click", () => select(index)));
    langButtons.forEach((btn) =>
      btn.addEventListener("click", () => setLang(btn.getAttribute("data-lang") || "zh")),
    );
    applyI18n();
    select(0);
  </script>
</body>
</html>
